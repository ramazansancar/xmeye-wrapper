# xmeye-wrapper — tek komutla host: docker compose up -d
# Cihaz bilgilerini .env dosyasına ya da buraya yaz.
#
# ÖNEMLİ: Bulut bağlantısı UDP NAT-traversal (P2P) kullanır. Docker'ın varsayılan bridge ağı
# UDP NAT'ı bozar → bağlantı kurulamaz. Bu yüzden HOST ağı kullanılır (network_mode: host).
# Linux sunucuda sorunsuz çalışır. (Windows/Mac Docker Desktop'ta host ağı kısıtlıdır; orada
# köprüyü doğrudan `go run ./server` ile çalıştırın. Asıl dağıtım hedefi Linux sunucu.)
services:
  wrapper:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: xmeye-wrapper:latest
    container_name: xmeye-wrapper
    restart: unless-stopped
    # Linux sunucuda host ağını açın (UDP NAT için şart):
    #   network_mode: host
    # Windows/Mac Docker Desktop host ağını desteklemez → orada bridge + port map (arayüz çalışır,
    # ama UDP NAT-traversal bozulur, video gelmez). Windows'ta geliştirme için `go run ./server` kullanın.
    ports:
      - "8080:8080"
    environment:
      XMEYE_ADDR: ":8080"
      XMEYE_NAME: "${XMEYE_NAME:-camera}"
      XMEYE_SERIAL: "${XMEYE_SERIAL:-}"
      XMEYE_USER: "${XMEYE_USER:-}"
      XMEYE_PASS: "${XMEYE_PASS:-}"
      XMEYE_CHANNELS: "${XMEYE_CHANNELS:-1}"
