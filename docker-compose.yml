# xmeye-wrapper — tek komutla: docker compose up -d --build
# Cihaz bilgileri .env dosyasından okunur (bkz. .env.example).
#
# ÖNEMLİ: Bulut bağlantısı UDP NAT-traversal (P2P) kullanır. Docker bridge ağı giden UDP'nin
# dönüş portunu değiştirir → NAT delme bozulur → video gelmez. Bu yüzden HOST ağı şarttır
# (network_mode: host). Host ağında port publish edilmez; sunucu doğrudan host:8080'i dinler.
#
# Linux sunucu: host ağı yerel → sorunsuz.
# Windows/Mac Docker Desktop (29+): host ağı WSL2 üzerinden desteklenir
#   (Settings > Resources > Network > "Enable host networking" açık olmalı).
#   Açık değilse UDP NAT bozulur (arayüz açılır, video gelmez) → ya ayarı aç ya `go run ./server`.
services:
  wrapper:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: xmeye-wrapper:latest
    container_name: xmeye-wrapper
    restart: unless-stopped
    network_mode: host          # UDP NAT-traversal için ŞART (port map ile çalışmaz)
    env_file:
      - .env
    environment:
      XMEYE_ADDR: ":8080"       # host ağında doğrudan host:8080 dinlenir
      XMEYE_NAME: "${XMEYE_NAME:-camera}"
      XMEYE_SERIAL: "${XMEYE_SERIAL:-}"
      XMEYE_USER: "${XMEYE_USER:-}"
      XMEYE_PASS: "${XMEYE_PASS:-}"
      XMEYE_CHANNELS: "${XMEYE_CHANNELS:-1}"
